name: Exact verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Verified immutable baselines, not moving version tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install reviewed hash-locked dependencies
        run: |
          test -s requirements.lock
          python -m pip --isolated install --only-binary=:all: --require-hashes -r requirements.lock
          python -m pip check
      - name: Check normal and optimized execution
        run: make test
      - name: Check committed certificates without regenerating them
        run: make verify
      - name: Independent hash-seed process
        env:
          PYTHONHASHSEED: '98765'
        run: python scripts/run_verifiers.py --check

  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify reviewed publication bytes and source provenance
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          root = Path('paper')
          report = json.loads((root/'paper1.revised.build.json').read_text())
          if report['entry_source'] != 'paper1.revised.tex' or not report['two_clean_builds_equal']:
              raise SystemExit('reviewed publication must use the revised source and two clean builds')
          current = {p.name for p in root.iterdir() if p.suffix in ('.tex', '.bib')}
          if current != set(report['source_sha256']):
              raise SystemExit('publication source inventory changed; review/rebuild the artifact')
          for name, expected in report['source_sha256'].items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest() != expected:
                  raise SystemExit('publication source changed: '+name)
          if hashlib.sha256((root/'paper1.revised.pdf').read_bytes()).hexdigest() != report['pdf_sha256']:
              raise SystemExit('reviewed publication PDF hash mismatch')
          PYCODE
      - name: Pull the reviewed immutable TeX image
        run: |
          python3 - <<'PYCODE'
          import json, subprocess
          lock = json.load(open('build-image.lock.json'))
          subprocess.run(['docker', 'pull', '--platform', lock['platform'], lock['image']], check=True)
          PYCODE
      - name: Build revised paper twice offline
        run: make paper-pinned
